        '204':
          description: No response body
components:
  schemas:
    AvailabilityStatusEnum:
      enum:
      - AVAILABLE
      - UNCONFIRMED
      - UNAVAILABLE
      type: string
      description: |-
        * `AVAILABLE` - Available (Confirmed)
        * `UNCONFIRMED` - Unconfirmed Availability
        * `UNAVAILABLE` - Unavailable
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        driver:
          type: string
          format: uuid
          readOnly: true
        driver_name:
          type: string
          readOnly: true
        driver_phone:
          type: string
          readOnly: true
        host_name:
          type: string
          readOnly: true
        host_phone:
          type: string
          readOnly: true
        charger:
          type: string
          format: uuid
        charger_title:
          type: string
          readOnly: true
        charger_locality:
          type: string
          readOnly: true
        vehicle:
          type: string
          format: uuid
        vehicle_details:
          allOf:
          - $ref: '#/components/schemas/Vehicle'
          readOnly: true
        booking_type:
          $ref: '#/components/schemas/BookingTypeEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        requested_start_at:
          type: string
          format: date-time
        requested_end_at:
          type: string
          format: date-time
          nullable: true
        accepted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        arrival_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        quoted_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
        currency:
          type: string
          readOnly: true
        exact_address:
          type: string
          readOnly: true
        access_instructions:
          type: string
          readOnly: true
        cancellation_reason:
          type: string
        dispute_reason:
          type: string
        session:
          allOf:
          - $ref: '#/components/schemas/ChargingSession'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - accepted_at
      - access_instructions
      - arrival_at
      - charger
      - charger_locality
      - charger_title
      - completed_at
      - created_at
      - currency
      - driver
      - driver_name
      - driver_phone
      - exact_address
      - host_name
      - host_phone
      - id
      - quoted_amount
      - session
      - status
      - updated_at
      - vehicle
      - vehicle_details
    BookingCreate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        charger:
          type: string
          format: uuid
        vehicle:
          type: string
          format: uuid
        booking_type:
