openapi: 3.0.3
info:
  title: ChargeNearby API
  version: 1.0.0
  description: 'Community-powered emergency EV charging discovery & private charger
    sharing platform. Source of truth: ChargeNearby Project Specification.'
paths:
  /api/v1/admin/chargers/{id}/approve/:
    post:
      operationId: v1_admin_chargers_approve_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/chargers/{id}/reject/:
    post:
      operationId: v1_admin_chargers_reject_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
