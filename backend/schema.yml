  /api/v1/chargers/:
    get:
      operationId: v1_chargers_list
      description: |-
        Public listing: returns ONLY approved, non-suspended chargers.
        Never exposes exact residential address or access instructions.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicChargerList'
          description: ''
  /api/v1/chargers/{id}/:
    get:
      operationId: v1_chargers_retrieve
